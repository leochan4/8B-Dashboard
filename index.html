<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onyxquant — HMA 200strat8B</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --onyx: #15110D;
            --cream: #F4EEE4;
            --iris: #AB96FF;
            --cream-55: rgba(244, 238, 228, 0.55);
            --cream-35: rgba(244, 238, 228, 0.35);
            --cream-15: rgba(244, 238, 228, 0.15);
            --hairline: rgba(244, 238, 228, 0.10);
            --positive: #9DB87B;
            --negative: #C49B7B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--onyx);
            color: var(--cream);
            line-height: 1.5;
            padding: 48px 24px;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1080px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 64px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--hairline);
        }

        .header-left h1 {
            font-family: 'Inter Tight', sans-serif;
            font-size: 32px;
            font-weight: 500;
            letter-spacing: -0.03em;
            color: var(--cream);
        }

        .header-left .eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--cream-55);
            margin-bottom: 8px;
        }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.08em;
        }

        .header-meta-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .header-meta-label {
            color: var(--cream-55);
            text-transform: uppercase;
            letter-spacing: 0.32em;
        }

        .header-meta-value {
            color: var(--cream);
        }

        /* Eyebrow label utility */
        .eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--cream-55);
        }

        /* Card */
        .card {
            background-color: var(--onyx);
            border: 1px solid var(--hairline);
            border-radius: 6px;
            padding: 24px;
        }

        /* Top grid */
        .grid-top {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        @media (max-width: 900px) {
            .grid-top {
                grid-template-columns: 1fr;
            }
        }

        .card-title {
            margin-bottom: 16px;
        }

        /* Current position */
        .position-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .position-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            padding: 4px 10px;
            border: 1px solid var(--hairline);
            border-radius: 6px;
            color: var(--cream);
        }

        .position-badge.long {
            border-color: var(--positive);
            color: var(--positive);
        }

        .position-badge.short {
            border-color: var(--negative);
            color: var(--negative);
        }

        .position-badge.flat {
            color: var(--cream-55);
            border-color: var(--cream-15);
        }

        .position-type {
            font-family: 'Inter Tight', sans-serif;
            font-size: 20px;
            font-weight: 500;
            color: var(--cream);
            letter-spacing: -0.02em;
        }

        .position-info {
            display: grid;
            gap: 10px;
        }

        .position-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        .position-label {
            color: var(--cream-55);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .position-value {
            color: var(--cream);
            font-weight: 500;
        }

        /* Stat card */
        .stat-value {
            font-family: 'Inter Tight', sans-serif;
            font-size: 32px;
            font-weight: 500;
            letter-spacing: -0.03em;
            color: var(--cream);
            margin-top: 8px;
            line-height: 1.1;
        }

        .stat-value.positive {
            color: var(--positive);
        }

        .stat-value.negative {
            color: var(--negative);
        }

        .stat-subtext {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--cream-55);
            margin-top: 8px;
            letter-spacing: 0.08em;
        }

        /* Performance section */
        .performance {
            background-color: var(--onyx);
            border: 1px solid var(--hairline);
            border-radius: 6px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .performance-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }

        .perf-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .perf-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--cream-55);
        }

        .perf-value {
            font-family: 'Inter Tight', sans-serif;
            font-size: 20px;
            font-weight: 500;
            color: var(--cream);
            letter-spacing: -0.02em;
        }

        .perf-value.positive {
            color: var(--positive);
        }

        .perf-value.negative {
            color: var(--negative);
        }

        .perf-value.muted {
            color: var(--cream-55);
        }

        /* Recent trades table */
        .trades-table {
            background-color: var(--onyx);
            border: 1px solid var(--hairline);
            border-radius: 6px;
            padding: 24px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            text-align: left;
            padding: 12px 16px 12px 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--cream-55);
            border-bottom: 1px solid var(--hairline);
        }

        th:last-child,
        td:last-child {
            padding-right: 0;
        }

        th.right {
            text-align: right;
        }

        td {
            padding: 16px 16px 16px 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--cream);
            border-bottom: 1px solid var(--hairline);
        }

        td.right {
            text-align: right;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            color: var(--cream);
            background-color: rgba(244, 238, 228, 0.02);
        }

        .trade-direction {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.16em;
        }

        .trade-direction.long {
            color: var(--positive);
        }

        .trade-direction.short {
            color: var(--negative);
        }

        .trade-pnl {
            font-weight: 500;
        }

        .trade-pnl.positive {
            color: var(--positive);
        }

        .trade-pnl.negative {
            color: var(--negative);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--cream-55);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.32em;
            text-transform: uppercase;
        }

        /* Footer */
        .footer {
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--cream-35);
            margin-top: 80px;
            padding-top: 24px;
            border-top: 1px solid var(--hairline);
            letter-spacing: 0.32em;
            text-transform: uppercase;
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 80px 24px;
            color: var(--cream-55);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.32em;
            text-transform: uppercase;
        }

        .error {
            border: 1px solid var(--negative);
            color: var(--negative);
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        /* Middle dot separator */
        .middot {
            color: var(--cream-35);
            margin: 0 8px;
        }

        /* ──────────────────────────────────────────────────────────────────
           Mobile responsiveness — applied at <= 720px (covers all phones)
           ────────────────────────────────────────────────────────────────── */
        @media (max-width: 720px) {
            body {
                padding: 20px 12px;
            }

            .container {
                max-width: 100%;
            }

            /* Header — stack vertically on mobile */
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
                margin-bottom: 32px;
                padding-bottom: 16px;
            }

            .header-left h1 {
                font-size: 22px;
            }

            .header-right {
                align-items: flex-start;
            }

            .header-meta-row {
                gap: 8px;
            }

            /* Cards — tighter padding */
            .card,
            .performance,
            .trades-table,
            .equity-curve-card {
                padding: 16px;
            }

            /* Top grid stacks at this width (overrides 900px rule below) */
            .grid-top {
                grid-template-columns: 1fr !important;
                gap: 12px;
                margin-bottom: 12px;
            }

            /* Smaller stat values */
            .stat-value {
                font-size: 22px;
            }

            .position-type {
                font-size: 16px;
            }

            /* Performance grid — 2 columns on phones */
            .performance-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }

            .perf-value {
                font-size: 14px;
            }

            /* Equity chart — shorter on mobile */
            .equity-svg {
                height: 180px;
            }

            .chart-meta {
                flex-wrap: wrap;
                gap: 12px;
                font-size: 10px;
            }

            /* Trades table — horizontal scroll works, but shrink the text */
            .trades-table {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            table {
                font-size: 11px;
                min-width: 560px;  /* lets table scroll horizontally inside its card */
            }

            th, td {
                padding: 10px 8px 10px 0;
                font-size: 11px;
            }

            /* Footer */
            .footer {
                margin-top: 40px;
                font-size: 9px;
            }
        }

        /* Even tighter for very small phones */
        @media (max-width: 380px) {
            body {
                padding: 16px 8px;
            }

            .header-left h1 {
                font-size: 20px;
            }

            .stat-value {
                font-size: 20px;
            }

            .performance-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Equity curve */
        .equity-curve-card {
            background-color: var(--onyx);
            border: 1px solid var(--hairline);
            border-radius: 6px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .chart-meta {
            display: flex;
            gap: 24px;
            margin-top: 12px;
            margin-bottom: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.08em;
            color: var(--cream-55);
        }

        .chart-meta-value {
            color: var(--cream);
            margin-left: 8px;
        }

        .chart-meta-value.positive { color: var(--positive); }
        .chart-meta-value.negative { color: var(--negative); }

        .equity-svg {
            width: 100%;
            height: 260px;
            display: block;
            overflow: visible;
        }

        .equity-axis-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.08em;
            fill: var(--cream-55);
        }

        .equity-line {
            fill: none;
            stroke: var(--cream);
            stroke-width: 1.25;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .equity-area {
            fill: rgba(244, 238, 228, 0.06);
            stroke: none;
        }

        .equity-zero-line,
        .equity-grid-line {
            stroke: var(--hairline);
            stroke-width: 1;
        }

        .equity-zero-line {
            stroke-dasharray: 2 4;
        }

        .equity-marker {
            fill: var(--cream);
            stroke: var(--onyx);
            stroke-width: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="eyebrow">Onyxquant · Live Trading</div>
                <h1>HMA 200strat8B</h1>
            </div>
            <div class="header-right">
                <div class="header-meta-row">
                    <span class="header-meta-label">Ticker</span>
                    <span class="header-meta-value">NVDA</span>
                </div>
                <div class="header-meta-row">
                    <span class="header-meta-label">Updated</span>
                    <span class="header-meta-value" id="lastUpdated">—</span>
                </div>
            </div>
        </div>

        <!-- Error state -->
        <div id="errorContainer"></div>

        <!-- Loading state -->
        <div id="loadingContainer" class="loading">Loading dashboard</div>

        <!-- Main content (hidden initially) -->
        <div id="mainContent" style="display: none;">
            <!-- Top grid: Position + Liquidity + P&L -->
            <div class="grid-top">
                <div class="card">
                    <div class="eyebrow card-title">Current Position</div>
                    <div id="positionContent"></div>
                </div>

                <div class="card">
                    <div class="eyebrow card-title">Net Liquidation</div>
                    <div id="liquidationContent"></div>
                </div>

                <div class="card">
                    <div class="eyebrow card-title">Net P&L</div>
                    <div id="pnlContent"></div>
                </div>
            </div>

            <!-- Performance -->
            <div class="performance">
                <div class="eyebrow">Performance</div>
                <div class="performance-grid" id="performanceContent"></div>
            </div>

            <!-- Equity curve -->
            <div class="equity-curve-card">
                <div class="eyebrow">Equity Curve</div>
                <div class="chart-meta" id="chartMeta"></div>
                <svg class="equity-svg" id="equityChart" preserveAspectRatio="none"></svg>
            </div>

            <!-- Recent trades -->
            <div class="trades-table">
                <div class="eyebrow">Recent Trades</div>
                <div id="tradesContent"></div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            Onyxquant <span class="middot">·</span> Est. 2026 <span class="middot">·</span> HMA 200strat8B
        </div>
    </div>

    <script>
        const REFRESH_INTERVAL = 60000;

        async function fetchData() {
            try {
                const url = './dashboard_data.json?t=' + Date.now();
                const response = await fetch(url);
                if (!response.ok) throw new Error('HTTP ' + response.status);

                const data = await response.json();
                renderDashboard(data);
                document.getElementById('loadingContainer').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('errorContainer').innerHTML = '';
            } catch (error) {
                console.error('Fetch error:', error);
                document.getElementById('loadingContainer').style.display = 'none';
                document.getElementById('mainContent').style.display = 'none';
                document.getElementById('errorContainer').innerHTML =
                    '<div class="error">Unable to load dashboard data.</div>';
            }
        }

        function fmtMoney(n, opts) {
            opts = opts || {};
            const sign = (opts.signed && n > 0) ? '+' : (n < 0 ? '-' : '');
            const val = Math.abs(n).toLocaleString('en-US', {
                minimumFractionDigits: opts.decimals != null ? opts.decimals : 2,
                maximumFractionDigits: opts.decimals != null ? opts.decimals : 2
            });
            return sign + '$' + val;
        }

        function fmtPct(n, opts) {
            if (n === null || n === undefined) return '—';
            opts = opts || {};
            const sign = (opts.signed && n > 0) ? '+' : '';
            return sign + n.toFixed(opts.decimals != null ? opts.decimals : 2) + '%';
        }

        function renderDashboard(data) {
            if (data.last_updated) {
                const date = new Date(data.last_updated);
                document.getElementById('lastUpdated').textContent =
                    date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }

            renderPosition(data.current_position);
            renderLiquidity(data.net_liquidation, data.stats.total_net_pnl, data.stats.pnl_as_pct_equity, data.currency || 'USD');
            renderPerformance(data.stats);
            renderEquityCurve(data.equity_curve || []);
            renderTrades(data.recent_trades);
        }

        function renderEquityCurve(curve) {
            const svg = document.getElementById('equityChart');
            const meta = document.getElementById('chartMeta');

            if (!curve || curve.length < 2) {
                svg.innerHTML = '';
                meta.innerHTML = '<div>No trade history yet</div>';
                return;
            }

            // Layout
            const W = svg.clientWidth || 1000;
            const H = 260;
            const padL = 60, padR = 16, padT = 16, padB = 28;
            const plotW = W - padL - padR;
            const plotH = H - padT - padB;

            svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

            // Data ranges
            const n = curve.length;
            const values = curve.map(p => p.cumulative_pnl);
            const minV = Math.min(0, ...values);
            const maxV = Math.max(0, ...values);
            const range = (maxV - minV) || 1;

            const xFor = i => padL + (plotW * i) / (n - 1);
            const yFor = v => padT + plotH - ((v - minV) / range) * plotH;
            const y0 = yFor(0);

            // Build polyline points
            const pts = curve.map((p, i) => `${xFor(i)},${yFor(p.cumulative_pnl)}`).join(' ');

            // Build area path (line + close down to baseline)
            const areaPts = `${xFor(0)},${y0} ` + pts + ` ${xFor(n-1)},${y0} Z`;

            // Build axis ticks (y axis: 4 evenly spaced + 0)
            const yTicks = [minV, minV + range * 0.25, minV + range * 0.5, minV + range * 0.75, maxV];
            const yTickEls = yTicks.map(v => {
                const y = yFor(v);
                return `<line class="equity-grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" opacity="0.5"/>
                        <text class="equity-axis-text" x="${padL - 8}" y="${y + 3}" text-anchor="end">${fmtCompactMoney(v)}</text>`;
            }).join('');

            // X axis labels: first, middle, last trade IDs
            const xTickIdxs = n <= 3
                ? curve.map((_, i) => i)
                : [0, Math.floor((n-1)/2), n-1];
            const xTickEls = xTickIdxs.map(i => {
                const x = xFor(i);
                const label = curve[i].trade_id === 0 ? 'Start' : `#${curve[i].trade_id}`;
                return `<text class="equity-axis-text" x="${x}" y="${H - 8}" text-anchor="middle">${label}</text>`;
            }).join('');

            // Marker on last point
            const lastX = xFor(n - 1);
            const lastY = yFor(values[n - 1]);

            // Assemble SVG
            svg.innerHTML = `
                ${yTickEls}
                <line class="equity-zero-line" x1="${padL}" y1="${y0}" x2="${W - padR}" y2="${y0}"/>
                <path class="equity-area" d="M ${areaPts}"/>
                <polyline class="equity-line" points="${pts}"/>
                <circle class="equity-marker" cx="${lastX}" cy="${lastY}" r="3"/>
                ${xTickEls}
            `;

            // Meta line above chart
            const finalPnl = values[n - 1];
            const pnlClass = finalPnl >= 0 ? 'positive' : 'negative';
            const trades = n - 1;
            const peak = Math.max(...values);
            const trough = Math.min(...values);
            meta.innerHTML = `
                <div>Trades<span class="chart-meta-value">${trades}</span></div>
                <div>Current<span class="chart-meta-value ${pnlClass}">${fmtMoney(finalPnl, {signed: true})}</span></div>
                <div>Peak<span class="chart-meta-value positive">${fmtMoney(peak, {signed: true})}</span></div>
                <div>Trough<span class="chart-meta-value ${trough < 0 ? 'negative' : ''}">${fmtMoney(trough, {signed: true})}</span></div>
            `;
        }

        function fmtCompactMoney(n) {
            const abs = Math.abs(n);
            const sign = n < 0 ? '-' : '';
            if (abs >= 1000) return sign + '$' + (abs / 1000).toFixed(1) + 'k';
            return sign + '$' + abs.toFixed(0);
        }

        function renderPosition(p) {
            const c = document.getElementById('positionContent');
            if (!p.has_position) {
                c.innerHTML =
                    '<div class="position-header">' +
                    '  <span class="position-badge flat">Flat</span>' +
                    '</div>' +
                    '<div class="position-info">' +
                    '  <div class="position-row"><span class="position-label">No open position</span></div>' +
                    '</div>';
                return;
            }

            const dirClass = p.direction === 'LONG' ? 'long' : 'short';
            let entryTimeStr = '—';
            let holdStr = '—';

            if (p.entry_time) {
                const entryDate = new Date(p.entry_time);
                entryTimeStr = entryDate.toLocaleTimeString('en-US',
                    { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }) + ' ET';

                const ms = new Date() - entryDate;
                const h = Math.floor(ms / 3600000);
                const m = Math.floor((ms % 3600000) / 60000);
                holdStr = h > 0 ? (h + 'h ' + m + 'm') : (m + 'm');
            }

            c.innerHTML =
                '<div class="position-header">' +
                '  <span class="position-badge ' + dirClass + '">' + p.direction + '</span>' +
                '  <span class="position-type">' + p.entry_type + '</span>' +
                '</div>' +
                '<div class="position-info">' +
                '  <div class="position-row"><span class="position-label">Entry</span><span class="position-value">$' + p.entry_price.toFixed(2) + '</span></div>' +
                '  <div class="position-row"><span class="position-label">Time</span><span class="position-value">' + entryTimeStr + '</span></div>' +
                '  <div class="position-row"><span class="position-label">Quantity</span><span class="position-value">' + p.position_size.toLocaleString() + '</span></div>' +
                '  <div class="position-row"><span class="position-label">Hold</span><span class="position-value">' + holdStr + '</span></div>' +
                '</div>';
        }

        function renderLiquidity(netLiq, netPnl, pnlPct, currency) {
            const liq = document.getElementById('liquidationContent');
            if (netLiq) {
                const currencyLabel = currency && currency !== 'USD' ? ' ' + currency : '';
                liq.innerHTML =
                    '<div class="stat-value">' + fmtMoney(netLiq) + '</div>' +
                    (currencyLabel ? '<div class="stat-subtext">' + currency + ' base currency</div>' : '');
            } else {
                liq.innerHTML = '<div class="stat-value muted" style="color: var(--cream-55)">—</div>';
            }

            const pnl = document.getElementById('pnlContent');
            const pnlClass = netPnl >= 0 ? 'positive' : 'negative';
            const pctStr = pnlPct !== null && pnlPct !== undefined
                ? fmtPct(pnlPct, { signed: true }) + ' of equity'
                : '— of equity';
            pnl.innerHTML =
                '<div class="stat-value ' + pnlClass + '">' + fmtMoney(netPnl, { signed: true }) + '</div>' +
                '<div class="stat-subtext">' + pctStr + '</div>';
        }

        function renderPerformance(stats) {
            const c = document.getElementById('performanceContent');
            const items = [
                { label: 'Total Trades', value: stats.total_trades.toString() },
                { label: 'Wins / Losses', value: stats.wins + ' / ' + stats.losses },
                { label: 'Win Rate', value: stats.win_rate.toFixed(1) + '%' },
                { label: 'Profit Factor', value: stats.profit_factor ? stats.profit_factor.toFixed(2) : '—' },
                { label: 'Sharpe Ratio', value: stats.sharpe_ratio !== null && stats.sharpe_ratio !== undefined ? stats.sharpe_ratio.toFixed(2) : '—' },
                { label: 'Max Drawdown', value: stats.max_drawdown ? fmtMoney(stats.max_drawdown, { signed: true }) : '$0.00', cls: stats.max_drawdown < 0 ? 'negative' : '' },
                { label: 'Avg Win', value: stats.avg_win ? fmtMoney(stats.avg_win) : '—', cls: stats.avg_win > 0 ? 'positive' : '' },
                { label: 'Avg Loss', value: stats.avg_loss ? fmtMoney(stats.avg_loss) : '—', cls: stats.avg_loss < 0 ? 'negative' : '' },
                { label: 'Best Trade', value: stats.best_trade ? fmtMoney(stats.best_trade) : '—', cls: stats.best_trade > 0 ? 'positive' : '' },
                { label: 'Worst Trade', value: stats.worst_trade ? fmtMoney(stats.worst_trade) : '—', cls: stats.worst_trade < 0 ? 'negative' : '' },
            ];

            c.innerHTML = items.map(function(it) {
                return '<div class="perf-item">' +
                       '  <div class="perf-label">' + it.label + '</div>' +
                       '  <div class="perf-value ' + (it.cls || '') + '">' + it.value + '</div>' +
                       '</div>';
            }).join('');
        }

        function renderTrades(trades) {
            const c = document.getElementById('tradesContent');
            if (!trades || trades.length === 0) {
                c.innerHTML = '<div class="empty-state">No trades yet</div>';
                return;
            }

            const rows = trades.map(function(t) {
                const dirClass = t.direction === 'LONG' ? 'long' : 'short';
                const pnlClass = t.net_pnl >= 0 ? 'positive' : 'negative';
                const dateStr = new Date(t.entry_date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                return '<tr>' +
                       '<td>#' + t.trade_id + '</td>' +
                       '<td>' + dateStr + '</td>' +
                       '<td><span class="trade-direction ' + dirClass + '">' + t.direction + '</span></td>' +
                       '<td>' + t.entry_type + '</td>' +
                       '<td class="right">$' + t.entry_price.toFixed(2) + '</td>' +
                       '<td class="right">$' + t.exit_price.toFixed(2) + '</td>' +
                       '<td class="right"><span class="trade-pnl ' + pnlClass + '">' + fmtMoney(t.net_pnl, { signed: true }) + '</span></td>' +
                       '<td>' + t.exit_type + '</td>' +
                       '</tr>';
            }).join('');

            c.innerHTML =
                '<table>' +
                '  <thead>' +
                '    <tr>' +
                '      <th>ID</th>' +
                '      <th>Date</th>' +
                '      <th>Direction</th>' +
                '      <th>Type</th>' +
                '      <th class="right">Entry</th>' +
                '      <th class="right">Exit</th>' +
                '      <th class="right">P&amp;L</th>' +
                '      <th>Exit Reason</th>' +
                '    </tr>' +
                '  </thead>' +
                '  <tbody>' + rows + '</tbody>' +
                '</table>';
        }

        let _lastData = null;
        const _origFetch = fetchData;
        fetchData = async function() {
            await _origFetch();
            // Capture data for resize re-render via global reference set in renderDashboard
        };

        // Cache latest data for resize re-rendering
        const _origRender = renderDashboard;
        renderDashboard = function(data) {
            _lastData = data;
            _origRender(data);
        };

        let _resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(_resizeTimer);
            _resizeTimer = setTimeout(() => {
                if (_lastData) renderEquityCurve(_lastData.equity_curve || []);
            }, 150);
        });

        fetchData();
        setInterval(fetchData, REFRESH_INTERVAL);
    </script>
</body>
</html>
