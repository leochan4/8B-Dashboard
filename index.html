<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMA 200strat8B · Trading Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #0d1117;
            color: #e6edf3;
            line-height: 1.5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #30363d;
        }

        .header-left h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 13px;
            color: #8b949e;
        }

        .header-ticker {
            font-weight: 600;
            color: #58a6ff;
        }

        .header-time {
            font-family: 'Monaco', 'Courier New', monospace;
            color: #58a6ff;
        }

        /* Main grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }

        /* Cards */
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
        }

        .card-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b949e;
            margin-bottom: 12px;
        }

        /* Current Position */
        .position-status {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: 600;
        }

        .position-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .position-badge.long {
            background-color: rgba(46, 160, 67, 0.15);
            color: #2ea043;
        }

        .position-badge.short {
            background-color: rgba(248, 81, 73, 0.15);
            color: #f85149;
        }

        .position-badge.flat {
            background-color: rgba(139, 148, 158, 0.15);
            color: #8b949e;
        }

        .position-type {
            color: #e6edf3;
        }

        .position-info {
            margin-top: 12px;
            display: grid;
            gap: 8px;
            font-size: 13px;
        }

        .position-row {
            display: flex;
            justify-content: space-between;
        }

        .position-label {
            color: #8b949e;
        }

        .position-value {
            color: #e6edf3;
            font-weight: 500;
        }

        /* Account Stats */
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin-top: 8px;
        }

        .stat-value.positive {
            color: #2ea043;
        }

        .stat-value.negative {
            color: #f85149;
        }

        .stat-subtext {
            font-size: 12px;
            color: #8b949e;
            margin-top: 4px;
        }

        /* Performance section (full width) */
        .performance {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .performance-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .perf-item {
            display: flex;
            flex-direction: column;
        }

        .perf-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b949e;
            margin-bottom: 6px;
        }

        .perf-value {
            font-size: 18px;
            font-weight: 700;
            color: #e6edf3;
        }

        .perf-value.positive {
            color: #2ea043;
        }

        .perf-value.negative {
            color: #f85149;
        }

        /* Recent Trades Table */
        .trades-table {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
        }

        .trades-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b949e;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 8px 0;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b949e;
            border-bottom: 1px solid #30363d;
        }

        td {
            padding: 12px 0;
            font-size: 13px;
            border-bottom: 1px solid #30363d;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: rgba(88, 166, 255, 0.05);
        }

        .trade-direction {
            font-weight: 600;
        }

        .trade-direction.long {
            color: #2ea043;
        }

        .trade-direction.short {
            color: #f85149;
        }

        .trade-pnl {
            font-weight: 600;
            text-align: right;
        }

        .trade-pnl.positive {
            color: #2ea043;
        }

        .trade-pnl.negative {
            color: #f85149;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #8b949e;
        }

        .empty-state-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 11px;
            color: #8b949e;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #30363d;
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }

        .error {
            background-color: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.3);
            color: #f85149;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h1>HMA 200strat8B</h1>
            </div>
            <div class="header-right">
                <div><span class="header-ticker">NVDA</span></div>
                <div>Updated: <span class="header-time" id="lastUpdated">--:--:--</span></div>
            </div>
        </div>

        <!-- Error state -->
        <div id="errorContainer"></div>

        <!-- Loading state -->
        <div id="loadingContainer" class="loading">Loading dashboard...</div>

        <!-- Main content (hidden initially) -->
        <div id="mainContent" style="display: none;">
            <!-- Position + Account grid -->
            <div class="grid">
                <!-- Current Position Card -->
                <div class="card">
                    <div class="card-title">Current Position</div>
                    <div id="positionContent"></div>
                </div>

                <!-- Net Liquidation Card -->
                <div class="card">
                    <div class="card-title">Net Liquidation</div>
                    <div id="liquidationContent"></div>
                </div>

                <!-- Net P&L Card -->
                <div class="card">
                    <div class="card-title">Net P&L</div>
                    <div id="pnlContent"></div>
                </div>
            </div>

            <!-- Performance section -->
            <div class="performance">
                <div class="card-title">Performance</div>
                <div class="performance-grid" id="performanceContent"></div>
            </div>

            <!-- Recent Trades Table -->
            <div class="trades-table">
                <div class="trades-title">Recent Trades</div>
                <div id="tradesContent"></div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>HMA 200strat8B Automated Trading System · Dashboard v1.0</p>
        </div>
    </div>

    <script>
        const REFRESH_INTERVAL = 60000; // 60 seconds

        async function fetchData() {
            try {
                const url = './dashboard_data.json?t=' + Date.now();
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                renderDashboard(data);
                document.getElementById('loadingContainer').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('errorContainer').innerHTML = '';
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('loadingContainer').style.display = 'none';
                document.getElementById('mainContent').style.display = 'none';
                document.getElementById('errorContainer').innerHTML = `
                    <div class="error">
                        Unable to load dashboard data. Make sure dashboard_data.json exists in the repository.
                    </div>
                `;
            }
        }

        function renderDashboard(data) {
            // Update last updated time
            if (data.last_updated) {
                const date = new Date(data.last_updated);
                const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                document.getElementById('lastUpdated').textContent = timeStr;
            }

            // Render position
            renderPosition(data.current_position);

            // Render liquidity
            renderLiquidity(data.net_liquidation, data.stats.total_net_pnl, data.stats.pnl_as_pct_equity);

            // Render performance stats
            renderPerformance(data.stats);

            // Render recent trades
            renderTrades(data.recent_trades);
        }

        function renderPosition(position) {
            const container = document.getElementById('positionContent');

            if (!position.has_position) {
                container.innerHTML = `
                    <div class="position-status">
                        <span class="position-badge flat">FLAT</span>
                    </div>
                    <div class="position-info">
                        <p style="color: #8b949e; font-size: 13px;">No open position</p>
                    </div>
                `;
                return;
            }

            const dirClass = position.direction === 'LONG' ? 'long' : 'short';
            const dirLabel = position.direction === 'LONG' ? 'LONG' : 'SHORT';
            let entry_time_str = '—';
            if (position.entry_time) {
                const date = new Date(position.entry_time);
                entry_time_str = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }

            const holdHours = position.entry_time ? Math.floor((new Date() - new Date(position.entry_time)) / (1000 * 60 * 60)) : 0;
            const holdMins = position.entry_time ? Math.floor(((new Date() - new Date(position.entry_time)) % (1000 * 60 * 60)) / (1000 * 60)) : 0;
            const holdStr = holdHours > 0 ? `${holdHours}h ${holdMins}m` : `${holdMins}m`;

            container.innerHTML = `
                <div class="position-status">
                    <span class="position-badge ${dirClass}">${dirLabel}</span>
                    <span class="position-type">${position.entry_type}</span>
                </div>
                <div class="position-info">
                    <div class="position-row">
                        <span class="position-label">Entry:</span>
                        <span class="position-value">$${position.entry_price.toFixed(2)}</span>
                    </div>
                    <div class="position-row">
                        <span class="position-label">Time:</span>
                        <span class="position-value">${entry_time_str} ET</span>
                    </div>
                    <div class="position-row">
                        <span class="position-label">Qty:</span>
                        <span class="position-value">${position.position_size.toLocaleString()}</span>
                    </div>
                    <div class="position-row">
                        <span class="position-label">Hold:</span>
                        <span class="position-value">${holdStr}</span>
                    </div>
                </div>
            `;
        }

        function renderLiquidity(netLiq, netPnl, pnlPct) {
            const liqContainer = document.getElementById('liquidationContent');
            const liqStr = netLiq ? `$${netLiq.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}` : '—';
            liqContainer.innerHTML = `<div class="stat-value">${liqStr}</div>`;

            const pnlContainer = document.getElementById('pnlContent');
            const pnlClass = netPnl >= 0 ? 'positive' : 'negative';
            const pnlSign = netPnl >= 0 ? '+' : '';
            const pnlStr = `${pnlSign}$${netPnl.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            const pnlPctStr = pnlPct !== null ? `${pnlSign}${pnlPct.toFixed(2)}%` : '—';
            pnlContainer.innerHTML = `
                <div class="stat-value ${pnlClass}">${pnlStr}</div>
                <div class="stat-subtext">${pnlPctStr} of equity</div>
            `;
        }

        function renderPerformance(stats) {
            const container = document.getElementById('performanceContent');

            const items = [
                { label: 'Total Trades', value: stats.total_trades, format: 'number' },
                { label: 'Wins / Losses', value: `${stats.wins} / ${stats.losses}`, format: 'text' },
                { label: 'Win Rate', value: `${stats.win_rate.toFixed(1)}%`, format: 'text' },
                { label: 'Profit Factor', value: stats.profit_factor ? stats.profit_factor.toFixed(2) : '—', format: 'text' },
                { label: 'Avg Win', value: stats.avg_win ? `$${stats.avg_win.toFixed(2)}` : '—', format: 'text', positive: true },
                { label: 'Avg Loss', value: stats.avg_loss ? `$${stats.avg_loss.toFixed(2)}` : '—', format: 'text', negative: true },
                { label: 'Best Trade', value: stats.best_trade ? `$${stats.best_trade.toFixed(2)}` : '—', format: 'text', positive: true },
                { label: 'Worst Trade', value: stats.worst_trade ? `$${stats.worst_trade.toFixed(2)}` : '—', format: 'text', negative: true },
            ];

            container.innerHTML = items.map(item => {
                let valueClass = '';
                if (item.positive) valueClass = 'positive';
                if (item.negative) valueClass = 'negative';

                return `
                    <div class="perf-item">
                        <div class="perf-label">${item.label}</div>
                        <div class="perf-value ${valueClass}">${item.value}</div>
                    </div>
                `;
            }).join('');
        }

        function renderTrades(trades) {
            const container = document.getElementById('tradesContent');

            if (!trades || trades.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No trades yet</p></div>';
                return;
            }

            const tableHtml = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Date</th>
                            <th>Direction</th>
                            <th>Type</th>
                            <th>Entry</th>
                            <th>Exit</th>
                            <th>P&L</th>
                            <th>Exit Reason</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${trades.map(trade => {
                            const dirClass = trade.direction === 'LONG' ? 'long' : 'short';
                            const pnlClass = trade.net_pnl >= 0 ? 'positive' : 'negative';
                            const pnlSign = trade.net_pnl >= 0 ? '+' : '';
                            const dateStr = new Date(trade.entry_date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

                            return `
                                <tr>
                                    <td>${trade.trade_id}</td>
                                    <td>${dateStr}</td>
                                    <td><span class="trade-direction ${dirClass}">${trade.direction}</span></td>
                                    <td>${trade.entry_type}</td>
                                    <td>$${trade.entry_price.toFixed(2)}</td>
                                    <td>$${trade.exit_price.toFixed(2)}</td>
                                    <td><span class="trade-pnl ${pnlClass}">${pnlSign}$${Math.abs(trade.net_pnl).toFixed(2)}</span></td>
                                    <td>${trade.exit_type}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;

            container.innerHTML = tableHtml;
        }

        // Initial fetch and setup auto-refresh
        fetchData();
        setInterval(fetchData, REFRESH_INTERVAL);
    </script>
</body>
</html>
